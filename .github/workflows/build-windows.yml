name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - Release

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[linux only]') && !contains(github.event.head_commit.message, '[alt only]') && !contains(github.event.head_commit.message, '[penguin alt only]'))
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Windows installer and portable exe
        run: npm run dist:release -w desktop

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Setup-*.exe -DestinationPath dist-out/OfflineChess.zip
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Portable-*.exe -DestinationPath dist-out/OfflineChess_Portable.zip
          Get-ChildItem dist-out | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Release v1.3.0
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - Upgraded to Stockfish 19
            - Made everything local
            - Uh fuck them ads
            - Made closer to chess.com review
            - Optional offline AI coach: explains your moves after you press Analyse. Pick a size in Settings (Compact 1.8 GB, Standard 2.5 GB, High quality 4 GB, Absurd 9 GB) or add your own .gguf model. Runs only on your computer.
            - New suggestion arrows: Best Result (green, shows the key moves of a strong attack such as a sacrifice leading to mate) and Move Threats (orange, shows what the move you played now attacks)
            - Clearer wording when a move throws away your advantage
            - Removed the three smallest AI sizes, they could not analyse, and weaker models no longer replace the normal explanation

            OfflineChess.zip - installer, adds a desktop shortcut
            OfflineChess_Portable.zip - single exe, no install

            On first launch the app asks which Stockfish 19 engine to download (Lite or Full), so you need internet once.
          files: |
            dist-out/OfflineChess.zip
            dist-out/OfflineChess_Portable.zip
