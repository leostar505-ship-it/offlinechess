name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - desktop-app
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Windows installer and portable exe
        run: npm run dist -w desktop

      - name: Zip Setup and Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Compress-Archive -Path desktop/release/full/OfflineChess-Setup-Full-*.exe, desktop/release/lite/OfflineChess-Setup-Lite-*.exe -DestinationPath dist-out/OfflineChess-Setup-1.0.0.zip
          Compress-Archive -Path desktop/release/full/OfflineChess-Portable-Full-*.exe, desktop/release/lite/OfflineChess-Portable-Lite-*.exe -DestinationPath dist-out/OfflineChess-Portable-1.0.0.zip
          Copy-Item node_modules/stockfish/bin/stockfish-19-single.js dist-out/
          Copy-Item node_modules/stockfish/bin/stockfish-19-single.wasm dist-out/
          Get-ChildItem dist-out | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-1
          name: OfflineChess build 1
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - Upgraded to Stockfish 19
            - Made everything local
            - Uh fuck them ads
          files: |
            dist-out/OfflineChess-Setup-1.0.0.zip
            dist-out/OfflineChess-Portable-1.0.0.zip
            dist-out/stockfish-19-single.js
            dist-out/stockfish-19-single.wasm
