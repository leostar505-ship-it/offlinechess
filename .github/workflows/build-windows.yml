name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - Release
    paths-ignore:
      - models.json

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[linux only]') && !contains(github.event.head_commit.message, '[alt only]') && !contains(github.event.head_commit.message, '[penguin alt only]'))
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Windows installer and portable exe
        run: npm run dist:release -w desktop

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Setup-*.exe -DestinationPath dist-out/OfflineChess.zip
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Portable-*.exe -DestinationPath dist-out/OfflineChess_Portable.zip
          Get-ChildItem dist-out | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: Release v1.7
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - Upgraded to Stockfish 19
            - Made everything local
            - Uh fuck them ads
            - Made closer to chess.com review
            - Optional offline AI coach: explains your moves after you press Analyse. Pick a size in Settings (Compact 1.8 GB, Standard 2.5 GB, High quality 4 GB, Absurd 9 GB) or add your own .gguf model. Runs only on your computer.
            - New suggestion arrows: Best Result (green, shows the key moves of a strong attack such as a sacrifice leading to mate) and Move Threats (orange, shows what the move you played now attacks)
            - New "All" suggestion arrows: shows the threats, the best alternative and the best line together, white moves in white and black moves in black
            - Privacy notice on every start: AI models and replies stay on your device, only the chess.com/lichess search goes online. Has a close button and a tick box to never show it again
            - When the coach cannot answer, the Ask the coach button turns red and says why (wrong squares, repeating the board, too short, model failed, unknown error) and you can ask again
            - New switch under each move to cycle the analysis between Stockfish, AI grounded (uses the app's findings) and AI self-dependent (the AI reasons from the board and engine line itself). Models with a thinking mode (Compact and Absurd, and some custom models) also get thinking versions of both, which are slower
            - A notice appears under the analysis switch whenever an AI mode is selected, saying the model is an AI and might make mistakes
            - Model downloads now reconnect and resume by themselves if the connection drops or stalls
            - The AI coach model list is now online: opening the model dropdown checks the models-list release on GitHub for new models, with a RAM warning based on the size in each model's name. The privacy notice mentions this
            - Model downloads can be paused and resumed, with a button to delete a partial download
            - Hotfix: the built-in explanations name the side (White's pawn, Black's advantage) instead of saying your pawn or your advantage, so they make sense whichever side you play
            - Ask the coach about a move: pick Explain (how the position stands and how the opponent can respond), Why this rating (a detailed answer), or type your own question
            - Clearer wording when a move throws away your advantage
            - Removed the three smallest AI sizes, they could not analyse, and weaker models no longer replace the normal explanation
            - New "Review" suggestion arrows in the arrow setting, drawn like chess.com's game review: green is the best move you could have played, orange is what your move now attacks, and red is how the opponent can punish a mistake or blunder. Knight moves are drawn as an L. Every arrow mode now uses the new drawing
            - Review also marks the board: red squares on the pieces your move attacks and on promotion squares, orange squares on pieces your move newly defends, and a tag naming the theme (for example Defends Pieces) on the square it is about
            - New theme detector, no AI needed: it recognises defending pieces, the opposition, taking or blocking a promotion square, zugzwang and finding the only good move, and names them in the move explanation (White and Black wording). The AI coach also gets the detected themes, and stays optional
            - The evaluation of the position now shows next to the move rating, with mate scores such as -M17

            OfflineChess.zip - installer, adds a desktop shortcut
            OfflineChess_Portable.zip - single exe, no install

            On first launch the app asks which Stockfish 19 engine to download (Lite or Full), so you need internet once.
          files: |
            dist-out/OfflineChess.zip
            dist-out/OfflineChess_Portable.zip
