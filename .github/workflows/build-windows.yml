name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - desktop-app
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Windows installer and portable exe
        run: npm run dist -w desktop

      - name: Zip the four packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Compress-Archive -Path desktop/release/full/OfflineChess-Setup-Full-*.exe -DestinationPath dist-out/Full_suite.zip
          Compress-Archive -Path desktop/release/full/OfflineChess-Portable-Full-*.exe -DestinationPath dist-out/Full_portable.zip
          Compress-Archive -Path desktop/release/lite/OfflineChess-Setup-Lite-*.exe -DestinationPath dist-out/Lite_suite.zip
          Compress-Archive -Path desktop/release/lite/OfflineChess-Portable-Lite-*.exe -DestinationPath dist-out/Lite_portable.zip
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Setup-Skeleton-*.exe -DestinationPath dist-out/skeleton_suite.zip
          Compress-Archive -Path desktop/release/skeleton/OfflineChess-Portable-Skeleton-*.exe -DestinationPath dist-out/skeleton_portable.zip
          Copy-Item node_modules/stockfish/bin/stockfish-19-lite-single.js dist-out/
          Copy-Item node_modules/stockfish/bin/stockfish-19-lite-single.wasm dist-out/
          Copy-Item node_modules/stockfish/bin/stockfish-19-single.js dist-out/
          Copy-Item node_modules/stockfish/bin/stockfish-19-single.wasm dist-out/
          Get-ChildItem dist-out | Select-Object Name, Length

      - name: Publish engine files for Lite
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-data
          name: engine-data
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Stockfish 19 engine files that the Lite editions download when you pick the full engine. You do not need these.
          files: |
            dist-out/stockfish-19-lite-single.js
            dist-out/stockfish-19-lite-single.wasm
            dist-out/stockfish-19-single.js
            dist-out/stockfish-19-single.wasm

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-2
          name: OfflineChess build 2
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - Upgraded to Stockfish 19
            - Made everything local
            - Uh fuck them ads

            Full_suite.zip - installer with everything included
            Full_portable.zip - single exe, no install, everything included
            Lite_suite.zip - smaller installer
            Lite_portable.zip - smaller single exe, no install

            Lite downloads the full Stockfish 19 only if you pick it in settings.
          files: |
            dist-out/Full_suite.zip
            dist-out/Full_portable.zip
            dist-out/Lite_suite.zip
            dist-out/Lite_portable.zip

      - name: Remove old engine files from the build release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset build-2 stockfish-19-single.js --yes
          gh release delete-asset build-2 stockfish-19-single.wasm --yes

      - name: Publish hotfix release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-2.0.1
          name: OfflineChess build 2.0.1 hotfix
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            Small downloads. The app comes without a chess engine and downloads Stockfish 19 on first launch, so you need internet once.

            skeleton_suite.zip - small installer, then pick Lite or Full engine on first launch
            skeleton_portable.zip - small single exe, no install, pick Lite or Full engine on first launch
          files: |
            dist-out/skeleton_suite.zip
            dist-out/skeleton_portable.zip
