name: Build Linux alt editions

on:
  workflow_dispatch:
  push:
    branches:
      - Release
    paths-ignore:
      - models.json

permissions:
  contents: write

concurrency:
  group: build-alt-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[windows only]') && !contains(github.event.head_commit.message, '[linux only]') && !contains(github.event.head_commit.message, '[alt only]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Full and Lite editions
        run: npm run dist:alt-linux -w desktop

      - name: Zip the four packages
        run: |
          mkdir -p dist-out
          ls -l desktop/release/full-linux desktop/release/lite-linux
          zip -j dist-out/Full_suite.zip desktop/release/full-linux/OfflineChess-*.deb
          zip -j dist-out/Full_portable.zip desktop/release/full-linux/OfflineChess-*.AppImage
          zip -j dist-out/Lite_suite.zip desktop/release/lite-linux/OfflineChess-*.deb
          zip -j dist-out/Lite_portable.zip desktop/release/lite-linux/OfflineChess-*.AppImage
          ls -l dist-out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: penguin-v1-alt
          name: Penguin v1 alt
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Linux build of OfflineChess with the Full and Lite editions.

            Full_suite.zip - .deb installer (Debian, Ubuntu, Mint and similar) with everything included
            Full_portable.zip - AppImage, no install, everything included
            Lite_suite.zip - smaller .deb installer
            Lite_portable.zip - smaller AppImage, no install

            For the AppImage: unzip, run `chmod +x` on it, then double-click it or run it from a terminal. Its data is kept in a folder next to it.

            Lite downloads the full Stockfish 19 only if you pick it in settings.
          files: |
            dist-out/Full_suite.zip
            dist-out/Full_portable.zip
            dist-out/Lite_suite.zip
            dist-out/Lite_portable.zip
