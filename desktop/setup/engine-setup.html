<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OfflineChess setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            color: #f0f0f0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        main { width: min(560px, 92vw); text-align: center; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0 0 24px; color: #b8b8b8; line-height: 1.5; }
        .choices { display: grid; gap: 14px; }
        button {
            font: inherit;
            color: inherit;
            text-align: left;
            padding: 16px 18px;
            border-radius: 10px;
            border: 1px solid #3c3c3c;
            background: #2a2a2a;
            cursor: pointer;
        }
        button:hover { border-color: #1aa8a4; background: #2f3535; }
        button strong { display: block; font-size: 17px; margin-bottom: 4px; }
        button span { color: #b8b8b8; font-size: 14px; }
        .progress { display: none; margin-top: 8px; }
        .bar { height: 10px; border-radius: 5px; background: #3a3a3a; overflow: hidden; }
        .fill { height: 100%; width: 0; background: #1aa8a4; transition: width 0.3s; }
        #status { margin-top: 12px; color: #b8b8b8; }
        #error { display: none; margin-top: 16px; color: #ff8a8a; }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to OfflineChess</h1>
        <p>One last step. Pick the Stockfish 19 engine to download. It is saved on this computer and you only do this once.</p>

        <div class="choices" id="choices">
            <button id="pick-lite">
                <strong>Lite (recommended)</strong>
                <span>About 2 MB. Fast and strong, works great for game analysis.</span>
            </button>
            <button id="pick-full">
                <strong>Full</strong>
                <span>About 97 MB. The strongest version, includes Lite as well.</span>
            </button>
        </div>

        <div class="progress" id="progress">
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div id="status">Starting download...</div>
        </div>

        <div id="error"></div>
    </main>
    <script src="/engine-setup.js"></script>
</body>
</html>
